# Herdr-only setup: no font installs, no terminal edits, no theme following.
variant = "text"
auto_install_font = false
follow_appearance = false
stable_order = true
show_tab = false
group_gap = false
worktree_mark = ""
idle_grace_seconds = 0
activity_fresh_minutes = 15
activity_stale_minutes = 120

# Where each panel's Git summary sits: inline (default), row, off.
heading_git = "inline"
space_git = "inline"
# Where the background-subagent count sits: heading (default), agent, row, off.
bg_badge = "heading"
